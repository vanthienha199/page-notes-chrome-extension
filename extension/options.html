<!doctype html>
<html><head><meta charset="utf-8"><title>Page Notes, options</title><link rel="stylesheet" href="ui.css">
<style>
  body { background: #f8fafc; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 32px; }
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; margin-top: 22px; }
  .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; }
  .panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin: 0 0 12px; }
  label.opt { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 10px 0; cursor: pointer; }
  .swatches { display: flex; gap: 10px; margin: 8px 0 16px; }
  .sw { width: 30px; height: 30px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
  .sw.on { border-color: #111827; }
  .btns { display: grid; gap: 8px; margin-top: 14px; }
  input[type=search] { width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 9px 12px; font-size: 14px; margin-bottom: 12px; }
  .site { border-top: 1px solid #f1f5f9; padding: 12px 0; }
  .site:first-of-type { border-top: 0; }
  .site a { font-size: 14px; font-weight: 600; color: #111827; text-decoration: none; }
  .site a:hover { text-decoration: underline; }
  .site .url { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .site .n { margin: 6px 0; }
  .saved { font-size: 12px; color: #16a34a; margin-left: 8px; opacity: 0; transition: opacity .2s; }
</style></head>
<body><div class="wrap">
  <div class="brand"><img src="icons/48.png" alt=""><h1 style="font-size:22px">Page Notes<small>Options and every note you have saved</small></h1><span class="badge">Sample build</span></div>
  <div class="grid">
    <div>
      <div class="panel">
        <h3>Highlight color</h3>
        <div class="swatches" id="swatches"></div>
        <h3>Behavior</h3>
        <label class="opt"><input type="checkbox" id="tooltip"> Show the Highlight button when I select text</label>
        <div class="muted">Shortcut to open the sidebar: Alt+N</div>
        <span class="saved" id="saved">Saved</span>
      </div>
      <div class="panel" style="margin-top:20px">
        <h3>Your data</h3>
        <div class="muted" id="totals"></div>
        <div class="btns">
          <button class="ghost" id="export">Export notes as JSON</button>
          <button class="ghost" id="import">Import from JSON</button>
          <button class="ghost" id="clear" style="color:#dc2626">Delete all notes</button>
          <input type="file" id="file" accept="application/json" hidden>
        </div>
      </div>
    </div>
    <div class="panel">
      <h3>All notes</h3>
      <input type="search" id="q" placeholder="Search highlights and notes">
      <div id="sites"></div>
    </div>
  </div>
</div>
<script src="shared.js"></script><script src="options.js"></script>
</body></html>
