<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><title>Page Notes, settings</title><link rel="stylesheet" href="ui.css">
<style>
  .wrap { max-width: 1056px; margin: 0 auto; padding: 40px 48px 56px; }
  .head { display: flex; align-items: center; gap: 16px; }
  .head h1 { font-size: 32px; margin: 0; line-height: 1.1; }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; margin-top: 32px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .card + .card { margin-top: 24px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--canvas); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px; margin-bottom: 24px; }
  .seg button { all: unset; cursor: pointer; text-align: center; font-size: 13px; padding: 7px 0; border-radius: 7px; color: var(--muted); }
  .seg button.on { background: var(--raised); color: var(--ink); font-weight: 500; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 24px; }
  .sw { cursor: pointer; text-align: center; font-size: 12px; color: var(--muted); }
  .sw i { display: block; height: 36px; border-radius: var(--radius); margin-bottom: 6px; border: 2px solid transparent; }
  .sw.on { color: var(--ink); }
  .sw.on i { border-color: var(--ink); }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
  .toggle span { font-size: 13px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch b { position: absolute; inset: 0; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: background .15s; }
  .switch b::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; border-radius: 50%; background: var(--muted); transition: transform .15s ease-out, background .15s; }
  .switch input:checked + b { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + b::after { transform: translateX(16px); background: var(--accent-ink); }
  .kbd { font-family: "Mono"; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; color: var(--ink); }
  .btns { display: grid; gap: 8px; margin-top: 16px; }
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .totals div { background: var(--canvas); border-radius: var(--radius); padding: 12px; }
  .totals b { display: block; font-size: 24px; font-weight: 500; line-height: 1.2; }
  .search { display: flex; gap: 12px; margin-bottom: 8px; }
  input[type=search] { flex: 1; background: var(--canvas); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; font: inherit; }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .site { border-top: 1px solid var(--line); padding: 20px 0 8px; }
  .site:first-child { border-top: 0; }
  .site a { font-weight: 600; font-size: 15px; color: var(--ink); text-decoration: none; }
  .site a:hover { color: var(--accent); }
  .site .count { font-family: "Mono"; font-size: 11px; color: var(--accent); margin-left: 8px; }
  .site .url { font-family: "Mono"; font-size: 11px; color: var(--faint); margin: 2px 0 12px; }
  .n { margin-bottom: 12px; }
  .n .meta { font-family: "Mono"; font-size: 11px; color: var(--faint); padding-left: 15px; margin-top: 4px; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  .saved { font-family: "Mono"; font-size: 11px; color: var(--accent); opacity: 0; transition: opacity .2s; margin-left: 12px; }
</style></head>
<body><div class="wrap">
  <div class="head brand"><img src="icons/128.png" alt="" style="width:44px;height:44px;border-radius:10px"><div><h1 class="display">Page Notes</h1><div class="muted" style="font-size:14px">Settings and every note you have saved</div></div><span class="saved" id="saved">Saved</span><span class="badge">Sample build</span></div>
  <div class="grid">
    <div>
      <div class="card">
        <p class="eyebrow">Appearance</p>
        <div class="seg" id="theme"><button data-v="dark">Dark</button><button data-v="light">Light</button><button data-v="system">System</button></div>
        <p class="eyebrow">Highlight color</p>
        <div class="swatches" id="swatches"></div>
        <div class="toggle"><span>Show the Highlight button when I select text</span><label class="switch"><input type="checkbox" id="tooltip"><b></b></label></div>
        <div class="toggle"><span>Sidebar side</span><div class="seg" id="side" style="grid-template-columns:1fr 1fr;margin:0;width:140px"><button data-v="left">Left</button><button data-v="right">Right</button></div></div>
        <div class="toggle"><span>Open the sidebar</span><span><span class="kbd">Alt</span> <span class="kbd">N</span></span></div>
      </div>
      <div class="card">
        <p class="eyebrow">Your data</p>
        <div class="totals"><div><b class="num" id="tNotes">0</b><span class="muted">notes</span></div><div><b class="num" id="tPages">0</b><span class="muted">pages</span></div></div>
        <div class="btns">
          <button class="btn ghost" id="export">Export as JSON</button>
          <button class="btn ghost" id="import">Import from JSON</button>
          <button class="btn ghost danger" id="clear">Delete all notes</button>
          <input type="file" id="file" accept="application/json" hidden>
        </div>
        <p class="muted" style="margin:16px 0 0">Stored only in this browser. Nothing is sent anywhere.</p>
      </div>
    </div>
    <div class="card">
      <p class="eyebrow">All notes</p>
      <div class="search"><input type="search" id="q" placeholder="Search highlights and notes"></div>
      <div id="sites"></div>
    </div>
  </div>
</div>
<script src="shared.js"></script><script src="options.js"></script>
</body></html>
